server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Don't leak the server version.
  server_tokens off;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP: scripts only from self (bundled); 'unsafe-inline' styles needed for
  # Tailwind/motion inline styles; images from self/data/https (remote covers).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # Hashed static assets — cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Large resource uploads (installers / packages) — stream, up to 10GB.
  location = /api/admin/resources/upload {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10g;
    proxy_request_buffering off; # stream to backend instead of buffering 10GB
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # API → backend service
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 60m; # covers doc import (≤30MB) & post attachments (≤50MB); each endpoint caps server-side
  }

  # Uploaded images → backend service
  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
